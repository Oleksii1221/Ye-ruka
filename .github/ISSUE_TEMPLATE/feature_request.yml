name: Feature request
description: Suggest a focused improvement for Ye-Ruka
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and user experience.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware impact
      description: List affected ESP32 boards, servos, sensors, protocols, or safety limits.
