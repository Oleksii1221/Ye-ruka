name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v2.2.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare build environment
        run: python tools/project.py setup

      - name: Build Windows release
        env:
          RELEASE_CHECKSUM_FILE: SHA256SUMS-Windows-x64.txt
        run: python tools/project.py release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ye-Ruka-Windows-x64
          path: dist/release/*

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/release/*

  ubuntu:
    name: Ubuntu x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Qt and desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prepare build environment
        run: python tools/project.py setup

      - name: Build Ubuntu release
        env:
          RELEASE_CHECKSUM_FILE: SHA256SUMS-Ubuntu-x64.txt
          QT_QPA_PLATFORM: offscreen
        run: python tools/project.py release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ye-Ruka-Ubuntu-x64
          path: dist/release/*

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/release/*
